services:
  db:
    image: postgres:17

    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: bookingpassword

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      INSTANCE_NAME: api1

      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: booking
      DB_USER: bookinguser
      DB_PASSWORD: bookingpassword

    depends_on:
      db:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      INSTANCE_NAME: api2

      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: booking
      DB_USER: bookinguser
      DB_PASSWORD: bookingpassword

    depends_on:
      db:
        condition: service_healthy

  api3:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      INSTANCE_NAME: api3

      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: booking
      DB_USER: bookinguser
      DB_PASSWORD: bookingpassword

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api1
      - api2
      - api3

volumes:
  postgres_data:
